name: PSN Trophy Sync & Deploy

on:
  schedule:
    # Run every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      localization_probe:
        description: "Inspect PSN official Korean responses without changing data"
        type: boolean
        default: false
      full:
        description: "Fetch all definitions and earned states"
        type: boolean
        default: false
      diagnose:
        description: "Reproduce legacy API failure without changing data"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Run Collector
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          PSN_TARGET_ONLINE_ID: "eggu_"
          PSN_FULL_SYNC: ${{ inputs.full }}
        run: |
          if [ "${{ inputs.localization_probe }}" = "true" ]; then
            npx tsx collector/scripts/localization-probe.ts
          elif [ "${{ inputs.diagnose }}" = "true" ]; then
            npx tsx collector/scripts/diagnose.ts
          else
            npm run collect
          fi

      - name: Upload diagnostic responses
        if: inputs.diagnose || inputs.localization_probe
        uses: actions/upload-artifact@v4
        with:
          name: psn-diagnostics
          path: diagnostics/

      - name: Commit & Push Canonical Snapshot
        if: ${{ !inputs.diagnose && !inputs.localization_probe }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --staged --quiet || (git commit -m "chore(data): auto sync trophy snapshot" && git push)
