name: PSN Trophy Sync & Deploy

on:
  schedule:
    # Run every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Run Collector
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          PSN_TARGET_ONLINE_ID: "eggu_"
        run: npm run collect

      - name: Commit & Push Canonical Snapshot
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --staged --quiet || (git commit -m "chore(data): auto sync trophy snapshot [skip ci]" && git push)
